[project]
name = "owl-bi"
version = "0.1.0"
description = "Publishing infrastructure for Streamlit dashboards — workspaces, role-based access, and token-based embeds with row-level security."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "streamlit>=1.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owl_bi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
